<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 360" width="100%" height="auto">
  <defs>
    <!-- Background Gradients -->
    <linearGradient id="bgGradient" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0B0F19" />
      <stop offset="50%" stop-color="#0F172A" />
      <stop offset="100%" stop-color="#1E293B" />
    </linearGradient>

    <!-- Vibrant Brand Accent Gradient -->
    <linearGradient id="primaryGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#38BDF8" />
      <stop offset="50%" stop-color="#2563EB" />
      <stop offset="100%" stop-color="#4F46E5" />
    </linearGradient>

    <!-- Text Glow & Metallic Gradient -->
    <linearGradient id="textGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#FFFFFF" />
      <stop offset="40%" stop-color="#F8FAFC" />
      <stop offset="100%" stop-color="#93C5FD" />
    </linearGradient>

    <!-- Subtle Slate Glow -->
    <linearGradient id="badgeBorder" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="rgba(56, 189, 248, 0.6)" />
      <stop offset="100%" stop-color="rgba(37, 99, 235, 0.15)" />
    </linearGradient>

    <!-- Glow Filter -->
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="16" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
    <filter id="softGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="8" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <style>
    .font-display { font-family: 'Outfit', 'Inter', system-ui, -apple-system, sans-serif; }
    .font-mono { font-family: ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, monospace; }
    .font-sans { font-family: 'Inter', system-ui, -apple-system, BlinkMacSystemFont, sans-serif; }
  </style>

  <!-- Deep Canvas Background -->
  <rect width="1200" height="360" rx="20" fill="url(#bgGradient)" stroke="#334155" stroke-width="1.5"/>

  <!-- Subtle High-Tech Blueprint Grid Pattern -->
  <g opacity="0.12" stroke="#60A5FA" stroke-width="1">
    <line x1="0" y1="60" x2="1200" y2="60" stroke-dasharray="4 6" />
    <line x1="0" y1="120" x2="1200" y2="120" stroke-dasharray="4 6" />
    <line x1="0" y1="180" x2="1200" y2="180" stroke-dasharray="4 6" />
    <line x1="0" y1="240" x2="1200" y2="240" stroke-dasharray="4 6" />
    <line x1="0" y1="300" x2="1200" y2="300" stroke-dasharray="4 6" />

    <line x1="120" y1="0" x2="120" y2="360" stroke-dasharray="4 6" />
    <line x1="240" y1="0" x2="240" y2="360" stroke-dasharray="4 6" />
    <line x1="360" y1="0" x2="360" y2="360" stroke-dasharray="4 6" />
    <line x1="480" y1="0" x2="480" y2="360" stroke-dasharray="4 6" />
    <line x1="600" y1="0" x2="600" y2="360" stroke-dasharray="4 6" />
    <line x1="720" y1="0" x2="720" y2="360" stroke-dasharray="4 6" />
    <line x1="840" y1="0" x2="840" y2="360" stroke-dasharray="4 6" />
    <line x1="960" y1="0" x2="960" y2="360" stroke-dasharray="4 6" />
    <line x1="1080" y1="0" x2="1080" y2="360" stroke-dasharray="4 6" />
  </g>

  <!-- Ambient Light Orbs -->
  <circle cx="160" cy="180" r="140" fill="#2563EB" opacity="0.25" filter="url(#glow)"/>
  <circle cx="1060" cy="90" r="120" fill="#38BDF8" opacity="0.18" filter="url(#glow)"/>
  <circle cx="680" cy="310" r="130" fill="#4F46E5" opacity="0.15" filter="url(#glow)"/>

  <!-- Left: Stylized Emblem / Logo Shield -->
  <g transform="translate(70, 75)">
    <!-- Outer Glow & Shield -->
    <rect x="0" y="0" width="190" height="210" rx="36" fill="rgba(15, 23, 42, 0.85)" stroke="url(#badgeBorder)" stroke-width="2.5" filter="url(#softGlow)"/>
    <rect x="8" y="8" width="174" height="194" rx="28" fill="none" stroke="rgba(255, 255, 255, 0.08)" stroke-width="1.5" />
    
    <!-- Central Gradient Monogram Badge -->
    <rect x="25" y="25" width="140" height="120" rx="22" fill="url(#primaryGrad)" />
    <text x="95" y="105" text-anchor="middle" class="font-display" font-weight="900" font-size="52" fill="#FFFFFF" letter-spacing="-2px">C2C</text>
    
    <!-- Sub-badge indicator -->
    <rect x="35" y="158" width="120" height="28" rx="14" fill="#0F172A" stroke="rgba(56, 189, 248, 0.4)" stroke-width="1.2"/>
    <circle cx="53" cy="172" r="4.5" fill="#10B981" />
    <text x="98" y="177" text-anchor="middle" class="font-mono" font-size="11" font-weight="700" fill="#38BDF8" letter-spacing="1.5">v2.4 READY</text>
  </g>

  <!-- Right / Main Content Hierarchy -->
  <g transform="translate(300, 65)">
    <!-- Pill Badge -->
    <g transform="translate(0, 10)">
      <rect x="0" y="0" width="370" height="32" rx="16" fill="rgba(37, 99, 235, 0.16)" stroke="rgba(56, 189, 248, 0.45)" stroke-width="1.2" />
      <circle cx="16" cy="16" r="4.5" fill="#38BDF8" />
      <text x="195" y="21" text-anchor="middle" class="font-sans" font-size="12" font-weight="600" fill="#93C5FD" letter-spacing="0.8">
        CAMPUS-TO-CORPORATE • RECRUITMENT SUITE
      </text>
    </g>

    <!-- Main Title: C2C Placement & Internship Portal -->
    <text x="0" y="102" class="font-display" font-weight="800" font-size="54" fill="url(#textGrad)" letter-spacing="-1.2px">
      C2C — Campus Portal
    </text>

    <!-- Subtitle: Value Proposition -->
    <text x="0" y="142" class="font-sans" font-weight="400" font-size="18" fill="#94A3B8" letter-spacing="-0.2px">
      Role-Based Campus Recruitment Platform with Server-Enforced Eligibility Engine
    </text>

    <!-- Feature Tag Chips Bar -->
    <g transform="translate(0, 172)">
      <!-- Chip 1: Role-Based (Student / Recruiter / Admin) -->
      <g transform="translate(0, 0)">
        <rect x="0" y="0" width="150" height="36" rx="10" fill="rgba(30, 41, 59, 0.85)" stroke="#334155" stroke-width="1.2"/>
        <text x="75" y="22" text-anchor="middle" class="font-sans" font-size="12.5" font-weight="600" fill="#E2E8F0">
          👥 3-Role Portals
        </text>
      </g>

      <!-- Chip 2: Eligibility Verification -->
      <g transform="translate(162, 0)">
        <rect x="0" y="0" width="180" height="36" rx="10" fill="rgba(30, 41, 59, 0.85)" stroke="#334155" stroke-width="1.2"/>
        <text x="90" y="22" text-anchor="middle" class="font-sans" font-size="12.5" font-weight="600" fill="#38BDF8">
          ⚡ CGPA Cutoff Engine
        </text>
      </g>

      <!-- Chip 3: Interview Pipeline Funnel -->
      <g transform="translate(354, 0)">
        <rect x="0" y="0" width="170" height="36" rx="10" fill="rgba(30, 41, 59, 0.85)" stroke="#334155" stroke-width="1.2"/>
        <text x="85" y="22" text-anchor="middle" class="font-sans" font-size="12.5" font-weight="600" fill="#A78BFA">
          🎯 Hiring Funnel &amp; Meets
        </text>
      </g>

      <!-- Chip 4: Enterprise Audit Logs -->
      <g transform="translate(536, 0)">
        <rect x="0" y="0" width="175" height="36" rx="10" fill="rgba(30, 41, 59, 0.85)" stroke="#334155" stroke-width="1.2"/>
        <text x="87" y="22" text-anchor="middle" class="font-sans" font-size="12.5" font-weight="600" fill="#34D399">
          🛡️ Institutional Auditing
        </text>
      </g>
    </g>

    <!-- Bottom Tech Pill Highlights -->
    <g transform="translate(0, 226)">
      <text x="0" y="14" class="font-mono" font-size="12" fill="#64748B" letter-spacing="0.5">
        CORE STACK:
      </text>
      <text x="100" y="14" class="font-mono" font-size="12" font-weight="600" fill="#CBD5E1" letter-spacing="0.5">
        React 18 + TypeScript • Node.js/Express • PostgreSQL 16 • Prisma ORM • Docker
      </text>
    </g>
  </g>

  <!-- Modern Accent Line on Bottom -->
  <rect x="0" y="354" width="1200" height="6" fill="url(#primaryGrad)" rx="3"/>
</svg>
