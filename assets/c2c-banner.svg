<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 300" width="100%" height="auto">
  <defs>
    <!-- Crisp, sentient clean white/luminescent background gradient -->
    <linearGradient id="sentientBg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FFFFFF" />
      <stop offset="45%" stop-color="#FAFCFF" />
      <stop offset="100%" stop-color="#F1F5F9" />
    </linearGradient>

    <!-- Sentient ethereal glow / subtle intelligent halo -->
    <radialGradient id="centerGlow" cx="50%" cy="50%" r="55%">
      <stop offset="0%" stop-color="#38BDF8" stop-opacity="0.12" />
      <stop offset="60%" stop-color="#818CF8" stop-opacity="0.04" />
      <stop offset="100%" stop-color="#FFFFFF" stop-opacity="0" />
    </radialGradient>

    <!-- Sentient intelligent gradient for abbreviation mark -->
    <linearGradient id="markGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0284C7" />
      <stop offset="50%" stop-color="#2563EB" />
      <stop offset="100%" stop-color="#4F46E5" />
    </linearGradient>

    <!-- Soft drop shadow for clean depth -->
    <filter id="softElevation" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="8" stdDeviation="16" flood-color="#0F172A" flood-opacity="0.04" />
    </filter>
  </defs>

  <style>
    .font-brand {
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', 'Inter', 'SF Pro Display', Roboto, sans-serif;
    }
  </style>

  <!-- Background Base Canvas -->
  <rect width="1200" height="300" rx="16" fill="url(#sentientBg)" stroke="#E2E8F0" stroke-width="1.2" />

  <!-- Ethereal Center Glow -->
  <rect width="1200" height="300" rx="16" fill="url(#centerGlow)" />

  <!-- Minimalist Centered Composition -->
  <g transform="translate(600, 150)" text-anchor="middle">
    <!-- C2C Primary Abbreviation -->
    <text
      x="0"
      y="-10"
      class="font-brand"
      font-size="82"
      font-weight="900"
      fill="url(#markGrad)"
      letter-spacing="14px"
      filter="url(#softElevation)"
    >C2C</text>

    <!-- Refined Minimal Separator Line -->
    <line
      x1="-90"
      y1="16"
      x2="90"
      y2="16"
      stroke="#CBD5E1"
      stroke-width="1.5"
      stroke-linecap="round"
    />

    <!-- Full Name in Sentient Slate Neutral -->
    <text
      x="0"
      y="54"
      class="font-brand"
      font-size="21"
      font-weight="500"
      fill="#334155"
      letter-spacing="7px"
    >CAMPUS TO CORPORATE</text>
  </g>
</svg>
